# Minimal conda environment for Fast-NeST-NN (paper + ArchitecturePerformanceExperiments + Profiling).
# Mirrors the intent of cuda11_env: PyTorch with CUDA 11.x, Optuna, scientific stack.
#
# Create (recommended):
#   conda env create -f environment.yml
#   conda activate fast-nest-nn
#
# Update an existing env from this file:
#   conda env update -f environment.yml --prune
#
# CPU-only: install PyTorch from https://pytorch.org for your platform, then:
#   conda install --file <(grep -v pytorch-cuda environment.yml)  # or use pip for torch
name: fast-nest-nn
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  - pip
  # CUDA 11.8 runtime (matches common "cuda11" stacks; adjust via pytorch.org if needed)
  # torch <2: both copies of nest_vnn src/util.py do `from torch._six import inf`,
  # which was removed in torch 2.0.
  - pytorch::pytorch<2
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::pytorch-cuda=11.8
  - optuna>=3.0,<4
  # pandas <2: util.calc_std_vals does df.groupby(['dataset'])['auc']; pandas >=2 yields
  # the 1-tuple ('CTRP',) as the group name, so std.txt keys never match and every label
  # becomes NaN while training still exits 0. Silent, not a crash.
  - pandas>=1.3,<2
  - numpy>=1.21,<2
  - scipy>=1.7
  - scikit-learn>=1.0
  - lightgbm>=3.3
  - matplotlib>=3.5
  - statsmodels
  - networkx>=2.6
  - tqdm>=4.60
  - pip:
    - torchmetrics>=0.10
